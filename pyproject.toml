[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepreason-agents-framework"
version = "0.1.0"
description = "Local-first heavy-reasoning multi-agent framework with evidence gates, memory, RAG, workflow graphs, skills, and optional Deep Agents runtime."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reasoning-agent = "reasoning_agent_template.cli:main"
deepreason-agent = "reasoning_agent_template.cli:main"

[project.optional-dependencies]
deepagents = [
  "deepagents",
  "langgraph",
]
dev = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reasoning_agent_template = [
  "web_static/*.html",
  "web_static/*.css",
  "web_static/*.js",
  "web_static/vendor/*.js",
]
